[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplexmotion"
version = "0.1.0"
description = "Python library for SimplexMotion SE010A servo motors over Modbus RTU"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pymodbus>=3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplexmotion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
